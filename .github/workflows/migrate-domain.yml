name: Migrate domain references

on:
  push:
    branches:
      - domain-migration-step1

permissions:
  contents: write

jobs:
  replace-domain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: domain-migration-step1
          fetch-depth: 0

      - name: Replace old domain in site files
        shell: bash
        run: |
          set -e
          grep -RIl --exclude-dir=.git 'mastera-tbilisi\.ge' . | while read -r file; do
            sed -i 's/mastera-tbilisi\.ge/mastera.ge/g' "$file"
          done
          rm -f .github/workflows/migrate-domain.yml
          git status --short

      - name: Commit migrated domain references
        shell: bash
        run: |
          set -e
          git config user.name "Conspiramedia"
          git config user.email "tayshinaleksander@gmail.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Update SEO URLs to mastera.ge"
          git push origin domain-migration-step1
