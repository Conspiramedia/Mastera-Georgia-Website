name: P0.2 Canonical fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p0-2-canonical.yml'

permissions:
  contents: write

jobs:
  fix-canonical:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix and validate canonical URLs
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          import sys

          domain = "https://mastera-tbilisi.ge"
          files = sorted(Path(".").glob("**/index.html"))
          assert len(files) == 109, f"Expected 109 index.html files, found {len(files)}"

          changed = []
          errors = []

          for path in files:
              rel = path.as_posix()
              expected = domain + "/" if rel == "index.html" else domain + "/" + rel[:-len("/index.html")] + "/"
              text = path.read_text(encoding="utf-8")

              pattern = re.compile(r'(<link\b[^>]*\brel=["\']canonical["\'][^>]*\bhref=["\'])[^"\']*(["\'])', re.I)
              m = pattern.search(text)
              if not m:
                  errors.append(f"{rel}: canonical missing")
                  continue

              current = m.group(0)
              href = re.search(r'href=["\']([^"\']+)["\']', current, re.I).group(1)
              if href != expected:
                  new_tag = pattern.sub(lambda x: x.group(1) + expected + x.group(2), current, count=1)
                  text = text[:m.start()] + new_tag + text[m.end():]
                  path.write_text(text, encoding="utf-8")
                  changed.append((rel, href, expected))

          if errors:
              print("\n".join(errors))
              sys.exit(1)

          # Re-read and validate every canonical.
          for path in files:
              rel = path.as_posix()
              expected = domain + "/" if rel == "index.html" else domain + "/" + rel[:-len("/index.html")] + "/"
              text = path.read_text(encoding="utf-8")
              matches = re.findall(r'<link\b[^>]*\brel=["\']canonical["\'][^>]*\bhref=["\']([^"\']+)["\']', text, re.I)
              if len(matches) != 1 or matches[0] != expected:
                  errors.append(f"{rel}: canonical={matches}, expected={expected}")

          if errors:
              print("\n".join(errors))
              sys.exit(1)

          audit = Path("SEO_AUDIT.md")
          audit_text = audit.read_text(encoding="utf-8")
          block = """## P0.2 Canonical

          - [x] Every localized service/category page must canonicalize to itself.
          - [x] RU pages → their RU URL.
          - [x] GE pages → their GE URL.
          - [x] EN pages → their EN URL.
          - [x] Fix language root canonicals:
            - [x] /ru/
            - [x] /ge/
            - [x] /en/
          - [x] Standardize canonical URLs with trailing slash.
          - [x] Ensure canonical URLs use HTTPS and the production domain."""
          start = audit_text.index("## P0.2 Canonical")
          end = audit_text.index("## P0.3 Hreflang")
          audit_text = audit_text[:start] + block + "\n\n" + audit_text[end:]
          audit.write_text(audit_text, encoding="utf-8")

          print(f"Validated 109/109 canonical URLs. Changed {len(changed)} files.")
          for rel, old, new in changed:
              print(f"{rel}: {old} -> {new}")
          PY

      - name: Commit changes and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/p0-2-canonical.yml
          git add -A
          git commit -m "SEO: fix canonical URLs" || exit 0
          git push origin main
