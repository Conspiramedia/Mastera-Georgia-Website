<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Страница не найдена</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            text-align: center;
            background: #fff;
            color: #222;
        }
        .error-page {
            padding: 40px 20px;
        }
        h1 {
            margin: 0 0 16px;
            font-size: 48px;
        }
        p {
            margin: 0 0 24px;
            font-size: 18px;
        }
        a {
            display: inline-block;
            padding: 12px 22px;
            color: #fff;
            background: #455a64;
            text-decoration: none;
            border-radius: 6px;
        }
        a:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <main class="error-page">
        <h1>404</h1>
        <p>Страница не найдена.</p>
        <a href="/">Вернуться на главную</a>
    </main>
</body>
</html>
