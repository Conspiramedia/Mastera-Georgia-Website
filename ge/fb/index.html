<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Страница-переходник: короткая ссылка mastera.ge/ge/fb для отправки
       грузиноязычным клиентам в WhatsApp. Папка ge/, но язык ka — так на всём сайте.
       Поисковикам не нужна — закрыта от индексации. -->
  <meta name="robots" content="noindex, nofollow">
  <title>ოსტატები საქართველოში — Facebook</title>

  <!-- Карточка для WhatsApp/Telegram — грузиноязычная, с картинкой ka.
       Переход намеренно сделан только на JS: meta refresh здесь стоять не должен —
       Telegram его выполняет, уходит на Facebook и показывает ЕГО карточку
       вместо нашей. Парсеры мессенджеров JS не исполняют, поэтому видят эти теги. -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://mastera.ge/ge/fb/">
  <meta property="og:title" content="ოსტატები საქართველოში — ჩვენ Facebook-ზე">
  <meta property="og:description" content="სანტექნიკოსი, ელექტრიკოსი, ოსტატი საათით თბილისსა და ბათუმში. ნამუშევრები, ფასები და აქციები ჩვენს Facebook გვერდზე.">
  <meta property="og:image" content="https://mastera.ge/image/og-preview-ka.jpg?v=31">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="ka_GE">
  <meta property="og:site_name" content="ოსტატები საქართველოში">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="ოსტატები საქართველოში — ჩვენ Facebook-ზე">
  <meta name="twitter:description" content="სანტექნიკოსი, ელექტრიკოსი, ოსტატი საათით თბილისსა და ბათუმში. ნამუშევრები და ფასები.">
  <meta name="twitter:image" content="https://mastera.ge/image/og-preview-ka.jpg?v=31">

  <style>
    /* Фирменный тёмный фон — чтобы кадр перед переходом не мигал белым */
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: #14121c;
      color: #f5f3f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
    }
    .brand { font-size: 22px; font-weight: 700; letter-spacing: .4px; }
    .note  { font-size: 15px; color: #a9a4b8; }
    /* Запасная ссылка — на случай, если и refresh, и JS не сработали
       (старый браузер, режим экономии трафика, блокировщик) */
    .fallback {
      display: inline-block;
      margin-top: 4px;
      padding: 12px 22px;
      border-radius: 10px;
      background: #ffc107;
      color: #14121c;
      font-weight: 700;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="brand">ოსტატები საქართველოში</div>
  <div class="note">იხსნება Facebook…</div>
  <a class="fallback" href="https://www.facebook.com/profile.php?id=61595113524507">Facebook-ზე გადასვლა</a>

  <script>
    // Единственный способ перехода — см. комментарий у OG-блока: meta refresh
    // ломает карточку в Telegram. Кто без JS — уйдёт по кнопке ниже.
    // replace(), а не href: не оставляет запись
    // в истории — иначе кнопка «Назад» вернула бы клиента на этот переходник,
    // и он снова улетел бы в Facebook, не сумев выйти.
    window.location.replace('https://www.facebook.com/profile.php?id=61595113524507');
  </script>
</body>
</html>
