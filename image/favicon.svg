<!-- Фавикон = знак логотипа в шапке: белый ключ в синем квадрате.
     Цвета и геометрия взяты из .logo__mark (redesign.css):
     градиент 135° от --blue-600 (#2f77eb) к --blue-700 (#1f62d2),
     скругление 13/42 от стороны — здесь 32/96 = те же пропорции.
     Путь ключа — тот же, что в разметке шапки, масштабирован с
     24 до 96 и обведён белым.
     ⚠️ Токенов CSS в SVG нет: файл открывается браузером отдельно
     от страницы, переменные там не определены — значения прописаны
     числами. Меняя палитру, поправь и здесь. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f77eb"/>
      <stop offset="1" stop-color="#1f62d2"/>
    </linearGradient>
  </defs>
  <rect width="96" height="96" rx="32" ry="32" fill="url(#bg)"/>
  <g transform="translate(48 48) scale(3.1) translate(-12 -12)">
    <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"
          fill="none" stroke="#ffffff" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
